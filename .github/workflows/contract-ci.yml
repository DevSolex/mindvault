name: Contract CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32v1-none
 fix/418-mcp-add-mcp-catalog-search-filters-parity
          components: rust-src

 main

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-contract-wasm-${{ hashFiles('contract/Cargo.toml', 'contract/Cargo.lock', 'contract/contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-contract-wasm-
            ${{ runner.os }}-cargo-

      - name: Install Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/raw/main/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build optimized wasm contract
        working-directory: contract
        run: stellar contract build --manifest-path Cargo.toml --optimize

      - name: Enforce WASM size budget
        working-directory: contract
        run: |
          WASM_FILE="target/wasm32v1-none/release/vault_registry.wasm"
          # 36 KB. Raised from 28 KB: the 28 KB figure was set against a
          # snapshot that did not yet include registry_info, the verifier role,
          # the on-chain verification mirror, metadata freeze, and index repair
          # — those merged together and the optimized build is now ~33 KB.
          MAX_SIZE=36864
          SIZE=$(stat -c%s "$WASM_FILE")
          echo "WASM Size: $SIZE bytes"
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::WASM size ($SIZE bytes) exceeds the maximum allowed budget ($MAX_SIZE bytes). Please optimize or explicitly update the budget if this growth is expected."
            exit 1
          fi

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: vault-registry-wasm
          path: contract/target/wasm32v1-none/release/*.wasm
          if-no-files-found: error

      - name: Run tests
        working-directory: contract
        run: cargo test

  no-std-check:
    name: Check no_std Compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,wasm32v1-none

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contract/target
          key: ${{ runner.os }}-contract-no-std-${{ hashFiles('contract/Cargo.toml', 'contract/Cargo.lock', 'contract/contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-contract-no-std-
            ${{ runner.os }}-contract-wasm-
            ${{ runner.os }}-cargo-

      - name: Check no_std compatibility
        working-directory: contract
        run: |
          # Build with default features only to ensure no std dependencies
          cargo build --release --target wasm32-unknown-unknown --no-default-features
          # Verify the contract still builds with standard features
          cargo build --release --target wasm32-unknown-unknown
